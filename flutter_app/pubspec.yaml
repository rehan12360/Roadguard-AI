name: roadguard_app
description: RoadGuard — real-time road hazard alerts
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.0

  # Maps & location
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # Voice alerts
  flutter_tts: ^4.0.2

  # Video & Image & AI
  video_player: ^2.8.2
  image_picker: ^1.0.7
  camera: ^0.11.4
  flutter_vision: ^2.0.0
  permission_handler: ^11.3.0

  # Backend calls (manual report ingestion)
  http: ^1.2.0

  # State management
  provider: ^6.1.2

  intl: ^0.19.0
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_size: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
